<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#00562d"><link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/verp-icon-180.png"><title>Installer VERP</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f0;color:#26392b;font:16px system-ui,sans-serif}main{max-width:440px;margin:32px auto;padding:24px}article{background:white;border-radius:20px;padding:28px;box-shadow:0 3px 18px #233d2715}img{display:block;width:180px;max-width:100%;margin:auto}h1{text-align:center}p,li{line-height:1.55}button,a.action{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#00562d;color:white;font:700 16px system-ui;text-align:center;text-decoration:none;margin-top:14px}button[hidden]{display:none}a.secondary{background:#e7eee6;color:#26392b}</style></head><body><main><article><img src="/verp-install-logo.png" alt="VERP"><h1>Installer VERP</h1><p>Ha hønseholdet ditt tilgjengelig direkte fra hjemskjermen.</p><button id="install" hidden>Installer VERP</button><div id="instructions"></div><p id="status" role="status"></p><a class="action secondary" href="/">Åpne VERP</a></article></main><script>if ('serviceWorker' in navigator && window.top === window.self) navigator.serviceWorker.register('/sw.js').catch(console.warn);
let promptEvent; const button=document.getElementById('install'), instructions=document.getElementById('instructions'), status=document.getElementById('status');
const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function guide(){instructions.innerHTML=ios?'<h2>iPhone og iPad</h2><p>Åpne denne siden i Safari.</p><ol><li>Trykk på Del (eventuelt via nettlesermenyen).</li><li>Velg Legg til på Hjem-skjerm.</li><li>Velg Åpne som nettapp hvis valget vises, og trykk Legg til.</li></ol>':'<h2>Installer fra nettleseren</h2><p>Åpne menyen i Chrome eller en annen støttet nettleser og velg Installer app eller Legg til på startskjermen, dersom tilgjengelig.</p>';}
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){status.textContent='VERP er allerede åpnet som app.';}else guide();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;button.hidden=false;instructions.hidden=true;});
button.onclick=async()=>{if(!promptEvent)return;const e=promptEvent;promptEvent=null;button.hidden=true;try{await e.prompt();const r=await e.userChoice;status.textContent=r.outcome==='accepted'?'Installasjon godkjent.':'Installasjon avbrutt.';}catch{status.textContent='Bruk nettlesermenyen for å installere.';}instructions.hidden=false;};
window.addEventListener('appinstalled',()=>{button.hidden=true;instructions.hidden=true;status.textContent='VERP er installert.';});
</script></body></html>
