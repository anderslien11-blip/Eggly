<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VERP Administrasjon</title><style>body{font:16px system-ui;background:#f2f5f1;color:#183c2b;max-width:600px;margin:auto;padding:20px}section,form{background:white;padding:18px;border-radius:12px;margin:12px 0}label{display:block;margin-top:12px}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border:1px solid #aaa;border-radius:7px}button{background:#075c36;color:white}[hidden]{display:none!important}</style><h1>VERP Administrasjon</h1><form id="login"><label>E-post<input id="email" type="email" required></label><label>Passord<input id="password" type="password" required></label><button>Logg inn</button></form><section id="panel" hidden><button id="logout">Logg ut</button><label>Hønsehold<select id="houses"></select></label><label>Nettadresse i Duda<input id="url" placeholder="https://verp.no/bestill-svena"></label><button id="enable">Aktiver nettbestilling</button><button id="disable">Deaktiver nettbestilling</button><p id="state"></p></section><p id="status" role="status"></p><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getFirestore,doc,getDoc,getDocs,collection,setDoc,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const db=getFirestore(initializeApp({apiKey:'AIzaSyBx88qpsM1Q15nPXYFo7d_gS1_Dxkga7w4',authDomain:'eggly-1f074.firebaseapp.com',projectId:'eggly-1f074',storageBucket:'eggly-1f074.firebasestorage.app',messagingSenderId:'375859175029',appId:'1:375859175029:web:8bc292e501f11c1d06223c'})),auth=getAuth(),$=id=>document.getElementById(id);
const status=t=>$('status').textContent=t; $('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(e){status(e.message)}}; $('logout').onclick=()=>signOut(auth); onAuthStateChanged(auth,async u=>{$('panel').hidden=true;$('login').hidden=!!u;try{if(!u)return;if(!(await getDoc(doc(db,'admins',u.uid))).exists())throw Error('Ingen administratortilgang');const snap=await getDocs(collection(db,'henhouses'));$('houses').replaceChildren(...snap.docs.map(d=>new Option(d.data().name+' – '+d.id,d.id)));$('panel').hidden=false;await refresh()}catch(e){status(e.message);await signOut(auth)}});async function refresh(){const id=$('houses').value;if(!id)return;const d=(await getDoc(doc(db,'webAccess',id))).data();$('url').value=d?.url||'';$('state').textContent=d?.enabled?'Aktivert':'Ikke aktivert'}$('houses').onchange=()=>refresh().catch(e=>status(e.message));async function save(enabled){try{const id=$('houses').value,url=$('url').value.trim();if(!id||!/^https:\/\/verp\.no\/[a-zA-Z0-9/_-]+$/.test(url))throw Error('Oppgi en gyldig underside på verp.no');await setDoc(doc(db,'webAccess',id),{enabled,url});await refresh();status('Lagret. Bestillingsside: https://eggly-1f074.web.app/bestill.html?house='+encodeURIComponent(id))}catch(e){status(e.message)}}$('enable').onclick=()=>save(true);$('disable').onclick=()=>save(false);</script></html>
