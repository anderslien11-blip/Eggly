<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestill egg</title><style>body{font:16px system-ui;background:#f2f5f1;color:#183c2b;max-width:600px;margin:auto;padding:20px}section,form{background:white;padding:18px;border-radius:12px;margin:12px 0}label{display:block;margin-top:12px}input,select,textarea,button{font:inherit;box-sizing:border-box;width:100%;padding:10px;margin:5px 0;border:1px solid #aaa;border-radius:7px}button{background:#075c36;color:white}[hidden]{display:none!important}</style><h1>Bestill egg</h1><section id="shop" hidden><h2 id="name"></h2><p id="info"></p><form id="order"><div id="products"></div><label>Navn<input id="customer" required maxlength="100"></label><label>Telefon<input id="phone" type="tel" required maxlength="30"></label><label>Mottak<select id="method"></select></label><div id="addressBox" hidden><label>Gateadresse, postnummer og poststed<input id="address" maxlength="200"></label></div><label>Ønsket dato<input id="date" type="date" required></label><label>Kommentar<textarea id="note" maxlength="150"></textarea></label><p id="total"></p><p>Bestillingen er en forespørsel. Selger bekrefter pris og tidspunkt. Kontaktopplysninger brukes til å håndtere bestillingen.</p><button id="send">Send forespørsel</button></form></section><p id="status" role="status"></p><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getFirestore,doc,getDoc,getDocs,collection,setDoc,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const db=getFirestore(initializeApp({apiKey:'AIzaSyBx88qpsM1Q15nPXYFo7d_gS1_Dxkga7w4',authDomain:'eggly-1f074.firebaseapp.com',projectId:'eggly-1f074',storageBucket:'eggly-1f074.firebasestorage.app',messagingSenderId:'375859175029',appId:'1:375859175029:web:8bc292e501f11c1d06223c'})),auth=getAuth(),$=id=>document.getElementById(id);
const id=new URLSearchParams(location.search).get('house'),status=t=>$('status').textContent=t;let cfg;const quantities=[];function calc(){let n=0;for(const [p,i] of quantities)n+=p.price*Number(i.value||0);if($('method').value==='delivery')n+=cfg.fee;$('total').textContent='Anslått total: '+n.toFixed(2)+' kr'}try{if(!id||id.includes('/'))throw Error('Ugyldig bestillingsside');cfg=(await getDoc(doc(db,'webShops',id))).data();if(!cfg?.open)throw Error('Bestilling er stengt');$('name').textContent=cfg.name;$('info').textContent=cfg.info;for(const p of cfg.products){const l=document.createElement('label'),i=document.createElement('input');l.textContent=p.name+' – '+p.price+' kr';i.type='number';i.min=0;i.max=100;i.step=1;i.value=0;i.oninput=calc;l.append(i);$('products').append(l);quantities.push([p,i])}if(cfg.pickup)$('method').add(new Option('Henter selv','pickup'));if(cfg.delivery)$('method').add(new Option('Levering','delivery'));$('method').onchange=()=>{const d=$('method').value==='delivery';$('addressBox').hidden=!d;$('address').required=d;calc()};$('method').onchange();$('shop').hidden=false}catch(e){status('Bestilling er ikke tilgjengelig.')} $('order').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const items=quantities.filter(([p,i])=>Number(i.value)>0).map(([p,i])=>({id:p.id,packs:Number(i.value)}));if(!items.length||items.some(x=>!Number.isInteger(x.packs)||x.packs>100))throw Error('Velg gyldig antall');await addDoc(collection(db,'webRequests',id,'requests'),{customer:$('customer').value.trim(),phone:$('phone').value.trim(),address:$('method').value==='delivery'?$('address').value.trim():'',delivery:$('method').value,date:$('date').value,note:$('note').value.trim(),items,status:'pending',createdAt:serverTimestamp()});$('shop').hidden=true;status('Forespørselen er sendt. Avvent bekreftelse fra selger.')}catch(e){status(e.message);$('send').disabled=false}};</script></html>
