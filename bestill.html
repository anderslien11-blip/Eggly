<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestill egg</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f1;color:#173b2a;font:16px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:clamp(16px,4vw,40px)}header{background:#075c36;color:white;padding:24px 30px;border-radius:18px;margin-bottom:24px}header img{width:105px;max-height:48px;object-fit:contain;object-position:left}h1{font-size:clamp(26px,4vw,38px);margin:10px 0 0}h2{font-size:22px;margin:0 0 12px}h3{font-size:18px;margin:0 0 16px}p{margin:8px 0;white-space:pre-line}#info{color:#52645a;margin-bottom:20px}form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.panel{background:white;border:1px solid #dce5dc;border-radius:16px;padding:24px;min-width:0}label{display:block;font-weight:600;margin:12px 0}input,select,textarea,button{font:inherit;min-width:0;border:1px solid #b7c8ba;border-radius:9px;padding:12px;width:100%;background:white;color:inherit}label input,label select,label textarea{display:block;margin-top:5px}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:wait}.product{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #e5ebe4}.product:last-child{border:0}.stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}.stepper button{width:38px;padding:7px;background:#eaf3e9;border:0;font-size:22px}.stepper input{width:52px;text-align:center;padding:7px 2px;appearance:textfield}.stepper input::-webkit-inner-spin-button{appearance:none}.price{color:#52645a;font-size:14px}.total{background:#eaf3e9;border-radius:12px;padding:16px;margin-top:20px;font-weight:700;font-size:21px}.fine{font-size:13px;color:#52645a;margin:14px 0}#send{background:#075c36;color:white;border:0;font-weight:700;padding:15px}#status:not(:empty){background:white;padding:16px;border-radius:12px;margin-top:16px}[hidden]{display:none!important}@media(max-width:700px){form{grid-template-columns:1fr}.panel{padding:18px}header{padding:20px}main{padding:12px}}@media(max-width:340px){.product{flex-wrap:wrap}}
</style></head><body><main><header><img src="verp-hvit.png" alt="VERP"><h1>Bestill ferske egg</h1></header><section id="shop" hidden><h2 id="name"></h2><p id="info"></p><form id="order"><div class="panel"><h3>Velg produkter</h3><div id="products"></div><div class="total" id="total" aria-live="polite"></div></div><div class="panel"><h3>Kontakt og levering</h3><label>Navn<input id="customer" required maxlength="100" autocomplete="name"></label><label>Telefon<input id="phone" type="tel" required maxlength="30" autocomplete="tel"></label><label>Mottak<select id="method"></select></label><div id="addressBox" hidden><label>Gateadresse, postnummer og poststed<input id="address" maxlength="200" autocomplete="street-address"></label></div><label>Ønsket dato<input id="date" type="date" required></label><label>Kommentar<textarea id="note" maxlength="150" rows="3"></textarea></label><p class="fine">Bestillingen er en forespørsel. Selger bekrefter pris og tidspunkt. Kontaktopplysninger brukes til å håndtere bestillingen.</p><button id="send">Send forespørsel</button></div></form></section><p id="status" role="status"></p></main><script type="module">import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
import {getFirestore,doc,getDoc,getDocs,collection,setDoc,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';
const db=getFirestore(initializeApp({apiKey:'AIzaSyBx88qpsM1Q15nPXYFo7d_gS1_Dxkga7w4',authDomain:'eggly-1f074.firebaseapp.com',projectId:'eggly-1f074',storageBucket:'eggly-1f074.firebasestorage.app',messagingSenderId:'375859175029',appId:'1:375859175029:web:8bc292e501f11c1d06223c'})),auth=getAuth(),$=id=>document.getElementById(id);
const id=new URLSearchParams(location.search).get('house'),status=t=>$('status').textContent=t;let cfg;const quantities=[];function calc(){let n=0;for(const [p,i] of quantities)n+=p.price*Number(i.value||0);if($('method').value==='delivery')n+=cfg.fee;$('total').textContent='Anslått total: '+new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(n)}try{if(!id||id.includes('/'))throw Error('Ugyldig bestillingsside');cfg=(await getDoc(doc(db,'webShops',id))).data();if(!cfg?.open)throw Error('Bestilling er stengt');$('name').textContent=cfg.name;$('info').textContent=cfg.info;for(const p of cfg.products){const row=document.createElement('div');row.className='product';const desc=document.createElement('div'),name=document.createElement('strong'),price=document.createElement('div');name.textContent=p.name;price.className='price';price.textContent=new Intl.NumberFormat('nb-NO',{style:'currency',currency:'NOK'}).format(p.price)+' per pakke';desc.append(name,price);const step=document.createElement('div');step.className='stepper';const i=document.createElement('input');i.type='number';i.min=0;i.max=100;i.step=1;i.value=0;i.setAttribute('aria-label','Antall '+p.name);i.oninput=calc;for(const delta of [-1,1]){const b=document.createElement('button');b.type='button';b.textContent=delta<0?'−':'+';b.setAttribute('aria-label',(delta<0?'Fjern ':'Legg til ')+p.name);b.onclick=()=>{i.value=Math.max(0,Math.min(100,(Number(i.value)||0)+delta));calc()};if(delta<0)step.append(b,i);else step.append(b)}row.append(desc,step);$('products').append(row);quantities.push([p,i])}if(cfg.pickup)$('method').add(new Option('Henter selv','pickup'));if(cfg.delivery)$('method').add(new Option('Levering','delivery'));$('method').onchange=()=>{const d=$('method').value==='delivery';$('addressBox').hidden=!d;$('address').required=d;calc()};$('method').onchange();$('shop').hidden=false}catch(e){status('Bestilling er ikke tilgjengelig.')} $('order').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const items=quantities.filter(([p,i])=>Number(i.value)>0).map(([p,i])=>({id:p.id,packs:Number(i.value)}));if(!items.length||items.some(x=>!Number.isInteger(x.packs)||x.packs>100))throw Error('Velg gyldig antall');await addDoc(collection(db,'webRequests',id,'requests'),{customer:$('customer').value.trim(),phone:$('phone').value.trim(),address:$('method').value==='delivery'?$('address').value.trim():'',delivery:$('method').value,date:$('date').value,note:$('note').value.trim(),items,status:'pending',createdAt:serverTimestamp()});$('shop').hidden=true;status('Forespørselen er sendt. Avvent bekreftelse fra selger.')}catch(e){status(e.message);$('send').disabled=false}};</script></body></html>
